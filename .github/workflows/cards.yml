name: Update profile cards
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/gen_cards.py", ".github/workflows/cards.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_cards.py assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light&color_snake=#c7a555
            assets/snake-dark.svg?palette=github-dark&color_snake=#c7a555
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update profile cards" && git push)
